[env:esp32-2432s028]
# Pin the ESP32 platform while diagnosing the Wi-Fi TCP reset.
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = COM6
lib_deps =
  TFT_eSPI
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DUSER_SETUP_LOADED
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF
  -DSMOOTH_FONT
  -DILI9341_2_DRIVER
  -DTOUCH_CS=33
